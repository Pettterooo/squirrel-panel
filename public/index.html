<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鼠须管外观面板</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>鼠须管外观面板</h1>
      <span class="badge" id="versionBadge">Squirrel</span>
    </div>
    <div class="header-meta">
      <span class="path" id="filePath">~/Library/Rime/squirrel.custom.yaml</span>
      <span class="dot-sep"></span>
      <span id="backupInfo">—</span>
      <button type="button" class="link-btn" id="deployLogBtn">部署日志</button>
    </div>
  </div>
</header>

<main>
  <section class="preview-pane">
    <div class="pane-head">
      <div class="segmented tabs" id="schemeTabs"></div>
    </div>
    <div class="stage" id="stage">
      <div class="win" id="win">
        <div class="paging-strip" id="pagingStrip" aria-hidden="true"></div>
        <div class="content">
          <div class="preedit" id="preedit">shu ru fa</div>
          <div class="cands" id="cands"></div>
        </div>
      </div>
    </div>
    <div class="readout" id="readout"></div>
  </section>

  <section class="controls" id="controls">
    <div class="card" id="schemeCard"></div>

    <div class="card" id="fontCard"></div>

    <div class="card">
      <div class="card-title">配色</div>
      <div class="color-grid" id="colorGrid"></div>
      <div id="optionalColors"></div>
    </div>

    <div class="card" id="shapeCard"></div>

    <div class="card">
      <div class="card-title">布局</div>
      <div class="field first">
        <div class="field-head"><label>候选排列</label></div>
        <div class="segmented" id="layoutSeg">
          <button type="button" data-layout="linear">横排</button>
          <button type="button" data-layout="stacked">竖排</button>
        </div>
      </div>
      <label class="switch-row">
        <span>内嵌编码（inline_preedit）</span>
        <input type="checkbox" id="inlinePreedit">
        <span class="switch"></span>
      </label>
      <label class="switch-row">
        <span>显示翻页（show_paging）</span>
        <input type="checkbox" id="showPaging">
        <span class="switch"></span>
      </label>
      <div id="layoutExtra"></div>
      <div id="menuExtra"></div>
    </div>

    <div class="card" id="appCard"></div>
  </section>
</main>

<footer class="applybar">
  <div class="applybar-inner">
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span class="status-text" id="statusText">正在读取配置…</span>
    </div>
    <div class="actions">
      <label class="sync">
        <input type="checkbox" id="syncSchemes" checked>
        <span class="checkbox"></span>
        同步字号与形状到另一套配色
      </label>
      <button type="button" class="action" id="reloadBtn" hidden>手动重新部署</button>
      <button type="button" class="action" id="undoBtn" disabled>撤销上次应用</button>
      <button type="button" class="action" id="resetBtn">还原为文件值</button>
      <button type="button" class="action primary" id="applyBtn" disabled>
        <span class="spinner"></span>应用到鼠须管<kbd>⌘S</kbd>
      </button>
    </div>
  </div>
</footer>

<datalist id="fontFaces">
  <option value="PingFang SC">苹方</option>
  <option value="Songti SC">宋体</option>
  <option value="Kaiti SC">楷体</option>
  <option value="Heiti SC">黑体</option>
  <option value="Hiragino Sans GB">冬青黑体</option>
  <option value="STHeiti">华文黑体</option>
  <option value="LXGW WenKai">霞鹜文楷</option>
  <option value="Menlo">Menlo</option>
  <option value="Monaco">Monaco</option>
</datalist>

<script src="app.js" defer></script>
</body>
</html>
